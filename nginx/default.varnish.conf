# Nginx VHOST for NPP-Optimized WordPress Setup  --  VARNISH TOPOLOGY              #
# ----------------------------------------------------------------------------     #
# Author: [Hasan ÇALIŞIR]                                                          #
# Purpose: Same site as default.conf, but with a Varnish / Vinyl Cache container   #
#          between the TLS edge and the FastCGI cache origin. Used only by         #
#          docker-compose.varnish.yml (nginx + wordpress mount this file).         #
# ----------------------------------------------------------------------------     #
# Cache Purge: compatible with denji ngx_cache_purge v4 module                     #
#   https://github.com/nginx-modules/ngx_cache_purge                               #
# ----------------------------------------------------------------------------     #
#                                                                                  #
#   visitor ──https──> :443  EDGE     TLS only, no cache, no purge endpoints       #
#                        │                                                         #
#                        └─http──> varnish:80  (separate container)                #
#                                     │                                            #
#                                     └─http──> :8080  ORIGIN  fastcgi_cache NPP   #
#                                                  │                               #
#                                                  └─fastcgi──> wordpress-fpm:9001 #
#                                                                                  #
#   wordpress-fpm ──https──> :8443  PURGE listener (NPP HTTP Purge, internal only)  #
#                                                                                  #
# Why three listeners instead of two:                                              #
#  - The purge locations must NOT live on the origin (8080). Varnish connects to   #
#    8080 from a private Docker IP, so `allow 172.16.0.0/12` would pass every      #
#    visitor who can reach the site and request /npp_purge_all. They live on a     #
#    separate listener (8443) that Varnish never uses.                             #
#  - 8443 is https on purpose. NPP only trusts an HTTP purge answer when the       #
#    scheme of the Purge Custom Base URL equals the scheme of the page URL         #
#    ("scheme differs from the purge request" otherwise, and it falls back to the  #
#    filesystem). The site is https, so the purge base URL must be https too:      #
#        Purge Custom Base URL = https://nginx:8443                                #
#                                                                                  #
# Cache key:                                                                       #
#  Entries are created over plain http (Varnish -> 8080), so $scheme in the key is #
#  "http". fastcgi_cache_key stays in the format NPP parses natively               #
#  ($scheme$request_method$host$request_uri). The purge locations on 8443 (where   #
#  $scheme is https) therefore build their key with a fixed "http" prefix.         #
#                                                                                  #
# Nothing here is published to the host: only 80/443 of the `nginx` service are.   #
# ----------------------------------------------------------------------------     #

# FastCGI Cache Path
#####################
fastcgi_cache_path /var/cache/nginx levels=1:2 keys_zone=NPP:100m max_size=1g inactive=30d;
#####################

# Nginx Temp Paths
#####################
# Prevents ngx_cache_purge purge_all from deleting
# in-flight temporary files (see ngx_cache_purge PR #66).
# Docker build defaults /var/cache/nginx and we have same path
# used as cache zone cause this issue.
fastcgi_temp_path     /dev/shm/fastcgi_temp 1 2;
proxy_temp_path       /dev/shm/proxy_temp 1 2;
uwsgi_temp_path       /dev/shm/uwsgi_temp 1 2;
scgi_temp_path        /dev/shm/scgi_temp 1 2;
client_body_temp_path /dev/shm/client_temp 1 2;
#####################

server {
    # Listen HTTP
    #################
    listen 80;
    server_name localhost;

    # HTTPS Redirect
    #################
    location / {
        return 301 https://$host$request_uri;
    }
}

###############################################################################
# EDGE :443  - TLS termination, reverse proxy to Varnish. No cache here.
###############################################################################
server {
    # Listen HTTPS
    #################
    listen 443 ssl;
    http2 on;
    server_name localhost;

    # Resolve Varnish at request time, not at nginx start.
    #################
    # `proxy_pass http://varnish:80;` would be resolved when nginx starts and nginx
    # would refuse to start while the varnish container is not up yet. Varnish
    # itself needs nginx (its backend) to be up first, so a static proxy_pass makes
    # a start-order cycle. 127.0.0.11 is Docker's embedded DNS.
    # While Varnish is down visitors get 502 (that is the expected fault behaviour).
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $npp_varnish "varnish:80";

    # Never let a visitor-supplied PURGE reach Varnish.
    #################
    # Varnish sees every request from this edge as coming from the edge container IP.
    # If that IP is inside the VCL purge ACL (it is when the whole Docker subnet is
    # allowed) a PURGE sent from the internet would pass the ACL. The control key in
    # the VCL is the second lock, this is the first one.
    if ($request_method = PURGE) { return 405; }

    # phpMyAdmin Reverse Proxy
    #################
    location = /phpmyadmin {
        return 301 $scheme://$host/phpmyadmin/;
    }

    location ~ ^/phpmyadmin/ {
        rewrite ^/phpmyadmin(/.*)$ $1 break;
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-Scheme $scheme;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_pass       http://phpmyadmin:80;
    }
    # End
    #####

    # NPP purge endpoints are internal only (8443). Same answer as an unknown path.
    #################
    location ^~ /npp_purge_ {
        return 404;
    }

    # Protect NPP runtime files
    #################
    location ^~ /wp-content/uploads/nginx-cache-purge-preload-runtime/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    # End
    #####

    # Stop Nginx from logging
    #################
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }
    # End
    #####

    # Everything else -> Varnish
    #################
    location / {
        proxy_pass         http://$npp_varnish;   # variable without URI: original request URI is passed as is
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_redirect     off;

        # Host must be the site host WITHOUT port: it is the Varnish hash key and
        # NPP's PURGE sends Host: <home_url host>. Both must be identical.
        # (Use $http_host instead only if your VCL hashes the port; then set the
        #  nppp_varnish_host_header filter in WordPress accordingly.)
        proxy_set_header   Host              $host;

        # Overwritten, never passed through: the origin trusts these two.
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Real-IP         $remote_addr;
    }
    # End
    #####

    # Dummy Self-Signed SSL Certificate (Don't use on Production)
    #################
    ssl_certificate /etc/ssl/fullchain.pem;
    ssl_certificate_key /etc/ssl/privkey.pem;
    ssl_trusted_certificate /etc/ssl/chain.pem;
    # End
    #####

    # SSL Settings / Security Headers (Enable on Production): see default.conf
}

###############################################################################
# ORIGIN :8080  - what Varnish fetches from. WordPress + fastcgi_cache NPP.
# Plain http, reachable only inside the Docker network. NO purge locations here.
###############################################################################
server {
    listen 8080;
    server_name localhost;

    # WP Document root
    #################
    root /var/www/html;
    index index.php index.html index.htm;

    # FCGI Cache Settings
    #################
    set $skip_cache 0;
    if ($request_method = POST)   { set $skip_cache 1; }
    if ($request_method = DELETE) { set $skip_cache 1; }
    if ($request_method = PUT)    { set $skip_cache 1; }
    if ($request_method = PATCH)  { set $skip_cache 1; }

    # Five maps defined in nginx.conf (http context) resolve all cache
    # exclusion logic (see default.conf for the full description).
    if ($skip_cache_path)   { set $skip_cache 1; }
    if ($skip_cache_query)  { set $skip_cache 1; }
    if ($skip_cache_cookie) { set $skip_cache 1; }
    if ($skip_cache_cart)   { set $skip_cache 1; }
    if ($skip_cache_xhr)    { set $skip_cache 1; }
    # End
    #####

    # The purge endpoints are not served here. Without this, a request for
    # /npp_purge_all that slipped past the edge would fall through to WordPress.
    #################
    location ^~ /npp_purge_ {
        return 404;
    }

    # Stop Nginx from logging
    #################
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
        allow all;
    }
    # End
    #####

    # Serve WP content
    #################
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }
    # End
    #####

    # Protect NPP runtime files
    #################
    location ^~ /wp-content/uploads/nginx-cache-purge-preload-runtime/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    # End
    #####

    # WP PHP-FPM PASS
    #################
    location ~ \.php$ {
        # Use NPP "Cache Key Regex" option for non-default structers
        ############################################################
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        ############################################################

        ############################################################
        # GENERATION MODE (INVALIDATE): comment out the fastcgi_cache_key line above and use:
        # cache_purge_key npp "$scheme$request_method$host$request_uri";
        # fastcgi_cache_key $cache_purge_key;
        # (then bind the same cache_purge_key in the 8443 purge locations, see there)
        ############################################################

        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index index.php;
        fastcgi_pass wordpress-fpm:9001;
        include /etc/nginx/fastcgi_params;

        # This listener is http, but the visitor came in over https at the edge.
        # WordPress (FORCE_SSL_ADMIN / is_ssl()) must see https or it redirects forever.
        # Placed AFTER the include on purpose: the later value wins at FPM.
        fastcgi_param HTTPS          on;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param SERVER_PORT    443;

        limit_req           zone=nppp_api burst=5 nodelay;   # Apply rate limit; allow burst of 5 with no queuing delay
        limit_req_status    429;                             # Return 429 Too Many Requests instead of default 503
        limit_req_log_level warn;                            # Log rate limit hits as warnings, not errors

        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        fastcgi_cache NPP;
        fastcgi_cache_valid 200 30d;
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_use_stale error timeout updating http_500 http_503;
        fastcgi_cache_lock on;
        fastcgi_cache_background_update on;

        # Prevent cookie leakage: remove Set-Cookie headers from cacheable responses
        # so that one user's cookies are never served to another user from cache.
        # (This also keeps Varnish from turning every page into hit-for-miss.)
        if ($skip_cache = 0) {
            more_clear_headers "Set-Cookie*";
        }

        # Ignore the upstream "Vary" header for cache STORAGE only (see default.conf).
        # Varnish still sees the Vary header and keeps its own variants.
        ############################################################
        fastcgi_ignore_headers Vary;
        ############################################################
    }
    # End
    #####

    # FastCGI Cache Status Header (Nginx layer). Varnish passes it through, so a
    # response shows both layers: this header + X-Varnish / Age from Varnish.
    #################
    add_header NPP-FastCGI-Cache $upstream_cache_status always;
    #################
}

###############################################################################
# PURGE listener :8443  - NPP HTTP Purge only. Internal, https, never proxied.
#   Purge Custom Base URL = https://nginx:8443
###############################################################################
server {
    listen 8443 ssl;
    server_name localhost;

    # Entries on disk were created over http (via Varnish -> 8080); $scheme here is
    # https, so the scheme part of the purge key is fixed.
    set $npp_origin_scheme http;

    # Internal callers only: loopback and the private ranges Docker hands out.
    # (172.16.0.0/12 is what default.conf allows; 10/8 and 192.168/16 cover the other
    #  address pools Docker may pick for the npp-wp network.) Not published to the host.

    # HTTP Purge - Single
    #################
    location ~ ^/npp_purge_single(/.*) {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny  all;
        fastcgi_cache_purge NPP "$npp_origin_scheme$request_method$host$1$is_args$args";

        ############################################################
        # GENERATION MODE (INVALIDATE): comment out the fastcgi_cache_purge line above and use:
        # cache_purge_key npp "$npp_origin_scheme$request_method$host$1$is_args$args";
        # fastcgi_cache_purge NPP $cache_purge_key;
        ############################################################
    }
    # End
    #####

    # HTTP Purge - All
    #################
    location = /npp_purge_all {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny  all;

        fastcgi_cache       NPP;
        fastcgi_cache_key   "$scheme$request_method$host$request_uri";
        fastcgi_cache_purge GET purge_all from all;

        ############################################################
        # GENERATION MODE (INVALIDATE): comment out the fastcgi_cache_key line above and use:
        # cache_purge_key npp "$scheme$request_method$host$request_uri";
        # fastcgi_cache_key $cache_purge_key;
        ############################################################
    }
    # End
    #####

    # HTTP Purge - Status (ngx_cache_purge v4)
    #################
    location = /npp_purge_status {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny  all;

        cache_purge_queue_status /var/cache/nginx;
    }
    # End
    #####

    # Nothing else is served here.
    #################
    location / {
        return 404;
    }

    # Dummy Self-Signed SSL Certificate (Don't use on Production)
    #################
    ssl_certificate /etc/ssl/fullchain.pem;
    ssl_certificate_key /etc/ssl/privkey.pem;
    ssl_trusted_certificate /etc/ssl/chain.pem;
    # End
    #####
}
